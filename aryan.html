<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Sour Soup | Aryan</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body data-default-author="aryan">
    <div class="page-shell">
        <header class="site-header">
            <a class="logo" href="index.html" aria-label="Hot Sour Soup home">
                <span class="logo-mark">hss</span>
                <span class="logo-text">Hot Sour Soup</span>
            </a>
            <nav class="site-nav" aria-label="Author filters">
                <a href="index.html" data-nav-author="all">All</a>
                <a href="index.html?author=himanshu" data-nav-author="himanshu">Himanshu</a>
                <a href="index.html?author=aryan" data-nav-author="aryan">Aryan</a>
            </nav>
        </header>

        <main>
            <section class="intro-panel" aria-labelledby="page-title">
                <div>
                    <p class="eyebrow">personal signals / bright archive</p>
                    <h1 id="page-title">Aryan's channel: clean sparks, bright fragments, and futuristic little discoveries.</h1>
                </div>
                <button class="radio-button" type="button" data-radio-toggle aria-pressed="false">
                    <span class="radio-light" aria-hidden="true"></span>
                    signal tone
                </button>
            </section>

            <section class="controls" aria-label="Post filters">
                <label>
                    <span>Author</span>
                    <select id="author-filter"></select>
                </label>
                <label>
                    <span>Tag</span>
                    <select id="tag-filter"></select>
                </label>
                <label>
                    <span>Post Theme</span>
                    <select id="theme-filter"></select>
                </label>
                <label>
                    <span>Visual Style</span>
                    <select id="visual-theme"></select>
                </label>
                <label class="search-box">
                    <span>Search</span>
                    <input id="search-filter" type="search" placeholder="title, text, link..." autocomplete="off">
                </label>
            </section>

            <section class="status-strip" aria-live="polite">
                <p id="post-count">Loading posts...</p>
                <button type="button" id="clear-filters">clear filters</button>
            </section>

            <section id="posts" class="post-list" aria-live="polite"></section>
            <template id="empty-state-template">
                <article class="empty-state">
                    <p class="eyebrow">no signal</p>
                    <h2>No posts match those filters.</h2>
                    <p>Try a wider tag, switch author, or clear the search box.</p>
                </article>
            </template>
        </main>

        <footer class="site-footer">
            <p>Static JSON posts, glass UI, and a little browser-native signal noise.</p>
        </footer>
    </div>

    <script src="posts.js" defer></script>
</body>
</html>
